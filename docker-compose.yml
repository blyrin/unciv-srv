services:
  unciv-srv:
    build: .
    image: unciv-srv:latest
    container_name: unciv-srv
    ports:
      - "11451:11451"
    environment:
      # 管理员账号（部署前务必修改！）
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # 数据库文件路径指向持久化卷
      DB_PATH: /data/unciv-srv.db
      # 网页登录限制：5 次 / 5 分钟
      MAX_ATTEMPTS: "5"
      LOCK_TIME: "5"
    volumes:
      - unciv-srv-data:/data
    restart: unless-stopped

volumes:
  unciv-srv-data:
