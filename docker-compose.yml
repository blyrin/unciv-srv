services:
  unciv-srv:
    build: .
    image: unciv-srv:latest
    container_name: unciv-srv
    ports:
      - "11451:11451"
    environment:
      # 管理员账号（部署前务必修改！）
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # 数据库文件路径指向持久化卷
      DB_PATH: /data/unciv-srv.db
      # 网页登录限制：5 次 / 5 分钟
      MAX_ATTEMPTS: "5"
      LOCK_TIME: "5"
      # 注册与联机开关：默认审核制（新账号需在后台「玩家管理」通过），不开放自助注册
      # 需要开放注册改 REGISTER_MODE=open，只服务预建账号改 closed
      REGISTER_MODE: approval
      # 关闭聊天改 "false"（存档同步与游戏更新推送不受影响）
      CHAT_ENABLED: "true"
      # IP 只存网段（IPv4 /24、IPv6 /48）并在 30 天后自动清空，完全不存改 none
      IP_STORAGE: anonymized
      IP_RETENTION_DAYS: "30"
      # 安装包托管目录（持久化卷）
      DOWNLOAD_DIR: /data/unciv-dl
      # 下载保护：并发 4、单连接 1MB/s、每 IP 每分钟 30 次、只保留最新版本
      DOWNLOAD_MAX_CONCURRENT: "4"
      DOWNLOAD_RATE_LIMIT_KBPS: "1024"
      DOWNLOAD_IP_LIMIT_PER_MINUTE: "30"
      DOWNLOAD_KEEP_VERSIONS: "1"
      # 单个上传文件大小上限（MB）
      DOWNLOAD_MAX_FILE_SIZE_MB: "512"
      # 从 GitHub 同步安装包的仓库与代理镜像（大陆服务器直连 GitHub release 不通，走镜像）
      DOWNLOAD_GITHUB_REPO: AutumnPizazz/Unciv
      DOWNLOAD_GITHUB_PROXY: https://gh-proxy.com/
    volumes:
      - unciv-srv-data:/data
    restart: unless-stopped

volumes:
  unciv-srv-data:
